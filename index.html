<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RAIR — access</title>
<style>
  :root{--bg:#fbfbfa;--ink:#1a1f24;--muted:#5d6b78;--line:#e3e6e9;--accent:#1f6feb;}
  @media (prefers-color-scheme:dark){
    :root{--bg:#14181c;--ink:#e8ecef;--muted:#9aa7b2;--line:#272d33;--accent:#6fa8ff;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .card{width:100%;max-width:620px;border:1px solid var(--line);border-radius:10px;
        padding:32px;background:transparent}
  h1{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:14px;margin-bottom:26px}
  a.link{display:block;word-break:break-all;font-size:18px;font-weight:600;
         color:var(--accent);text-decoration:none;padding:16px;border:1px solid var(--line);
         border-radius:8px;margin-bottom:18px}
  a.link:hover{text-decoration:underline}
  .meta{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
  .meta div{margin-bottom:5px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
</style>
</head>
<body>
<div class="card">
  <h1>RAIR — automated reviewer</h1>
  <div class="sub">IEEE Transactions on Medical Imaging</div>
  <a class="link" id="u" href="https://jane-adopt-mom-translations.trycloudflare.com">https://jane-adopt-mom-translations.trycloudflare.com</a>
  <div class="meta">
    <div>Last updated: <span id="t">2026-09-08 01:35 UTC</span></div>
    <div>The address changes whenever the tunnel restarts; this page follows it
         automatically, so please bookmark <em>this</em> page rather than the address above.</div>
  </div>
</div>
</body>
</html>
